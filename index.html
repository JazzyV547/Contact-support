<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Login</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-shell">
      <div class="auth-visual">
        <span class="tag">Workspace online</span>
        <h2>Every conversation, kept in one place.</h2>
        <p>Sign in to pick up where you left off, or start a new conversation with your team.</p>
        <div class="stat-row">
          <div class="stat"><b>24/7</b><span>Coverage</span></div>
          <div class="stat"><b>&lt;2m</b><span>Avg. response</span></div>
          <div class="stat"><b>100%</b><span>Encrypted</span></div>
        </div>
      </div>

      <div class="auth-card">
        <div class="brand-badge">
          <div class="logo-mark" id="brandInitial">S</div>
          <h1 id="brandName">Support</h1>
          <p id="brandSubtitle">Enter your email or WhatsApp number to continue</p>
        </div>

        <div class="error-msg" id="error"></div>

        <form id="loginForm">
          <div class="form-group">
            <label for="contact">Email or WhatsApp number</label>
            <input id="contact" type="text" required placeholder="you@email.com or +1 555 123 4567" autocomplete="username" />
            <div class="field-hint" id="contactHint"></div>
          </div>
          <button class="btn btn-primary" type="submit">Continue</button>
        </form>

        <div class="auth-footer">
          New here? <a id="signupLink" href="signup.html">Create an account</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    applyBrandTheme();
    const brand = getBrand();
    document.getElementById('brandName').textContent = brand;
    document.getElementById('brandInitial').textContent = brand.charAt(0).toUpperCase();
    document.title = brand + ' — Login';

    const siteSlug = getSiteSlug();
    const linkSlug = getLinkSlug();
    document.getElementById('signupLink').href =
      'signup.html?site=' + encodeURIComponent(siteSlug) + '&link=' + encodeURIComponent(linkSlug);

    const session = Store.getSession();
    const explicitSite = explicitSiteParam();
    if (session) {
      if (session.isAdmin || !explicitSite || session.site === explicitSite) {
        location.href = session.isAdmin ? 'admin.html' : 'chat.html';
      } else {
        Store.clearSession();
      }
    }

    const form = document.getElementById('loginForm');
    const submitBtn = form.querySelector('button[type="submit"]');
    const contactInput = document.getElementById('contact');
    const contactHint = document.getElementById('contactHint');
    const err = document.getElementById('error');

    function looksLikeEmail(value) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
    }

    function checkContactShape() {
      const value = contactInput.value.trim();

      if (!value) {
        contactInput.classList.remove('invalid');
        contactHint.textContent = '';
        contactHint.classList.remove('error');
        return false;
      }

      if (value.includes('@') && !looksLikeEmail(value)) {
        contactInput.classList.add('invalid');
        contactHint.textContent = 'That email address looks incomplete.';
        contactHint.classList.add('error');
        return false;
      }

      contactInput.classList.remove('invalid');
      contactHint.textContent = '';
      contactHint.classList.remove('error');
      return true;
    }

    contactInput.addEventListener('input', checkContactShape);

    form.addEventListener('submit', async function (e) {
      e.preventDefault();

      const value = contactInput.value.trim();
      if (!value) return;
      if (!checkContactShape()) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in…';
      err.classList.remove('show');

      try {
        const user = await findUser(value);
        if (!user) {
          err.textContent = "We couldn't find an account with that email or WhatsApp number for " + brand + ". If you're new here, create an account below.";
          err.classList.add('show');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Continue';
          return;
        }

        Store.setSession({
          id: user.id,
          name: user.name,
          email: user.email,
          whatsapp: user.whatsapp,
          isAdmin: !!user.isAdmin,
          site: user.site,
          siteName: user.siteName
        });
        location.href = user.isAdmin ? 'admin.html' : 'chat.html';
      } catch (ex) {
        console.error(ex);
        err.textContent = 'Something went wrong. Please try again.';
        err.classList.add('show');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Continue';
      }
    });
  </script>
</body>
</html>
